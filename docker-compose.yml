name: maua.ke

# ---------------------------------------------------------------------------
# Shared env block for every PHP/Laravel process (api, horizon, scheduler).
# Defined once via a YAML anchor so the three services can never drift out
# of sync with each other — a very common source of "works via HTTP but
# breaks in the queue worker" bugs.
# ---------------------------------------------------------------------------
x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-maua-ke}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost}

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-maua-ke}
  DB_USERNAME: ${POSTGRES_USER:-maua-ke}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-maua-ke}

  # Redis is logically partitioned by DB index so cache flushes, session
  # storage, and Horizon's queue/job data can never collide or be
  # accidentally wiped by each other (mirrors the production guide).
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
  REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
  REDIS_SESSION_DB: ${REDIS_SESSION_DB:-3}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  HORIZON_PREFIX: ${HORIZON_PREFIX:-horizon:maua-ke:}

  # Nginx sits in front of both api and web on one origin, so the browser
  # never makes a cross-origin request — only needed if something calls
  # the API directly, bypassing nginx.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

  # Ecommerce-specific storage paths (renamed from the payroll-era
  # PAYSLIP_STORAGE_DIR to match this app's actual domain objects).
  PRODUCT_MEDIA_STORAGE_DIR: /var/www/storage/product-media
  INVOICE_STORAGE_DIR: /var/www/storage/invoices
  RECEIPT_STORAGE_DIR: /var/www/storage/receipts
  DOCUMENT_STORAGE_DIR: /var/www/storage/documents

  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
  MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
  MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
  MPESA_PASSKEY: ${MPESA_PASSKEY:-}
  MPESA_ENV: ${MPESA_ENV:-sandbox}
  MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}

  # Mailpit replaces a real SMTP provider for local dev: every email the
  # app sends (order confirmations, password resets) is caught locally
  # and viewable in a browser instead of hitting a real inbox or bouncing.
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@maua-ke.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-maua-ke}

  # MinIO stands in for AWS S3 locally so the app's real "s3" filesystem
  # disk (product images, invoices, receipts) is exercised in dev instead
  # of silently falling back to local disk and only breaking in staging.
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-maua-ke}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-maua-ke-secret}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${MINIO_BUCKET:-maua-ke-media}
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

services:
  # -------------------------------------------------------------------------
  # Data stores
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maua-ke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maua-ke}
      POSTGRES_DB: ${POSTGRES_DB:-maua-ke}
    ports:
      - "5436:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-maua-ke} -d ${POSTGRES_DB:-maua-ke}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [maua-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so Horizon's queued jobs and any distributed locks
    # survive a `docker compose restart redis` while you're mid-checkout.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [maua-net]

  # -------------------------------------------------------------------------
  # Application
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel-env
    volumes:
      # Live-reload: your local source is bind-mounted over the image's
      # code, so edits to PHP files are picked up instantly (Octane
      # workers still need `octane:reload` — see the note below).
      - ./apps/api:/var/www
      # Named volume so the container's own vendor/ (built during image
      # build, matching container OS/PHP extensions) isn't clobbered by
      # whatever host OS `composer install` you happen to have run.
      - api-vendor:/var/www/vendor
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [maua-net]

  # Dedicated queue worker process. MUST run as its own container/process —
  # running Horizon inside the same container as the HTTP server means an
  # `octane:reload` or container restart silently kills your workers, and
  # `docker compose logs api` becomes an unreadable mix of HTTP + job logs.
  horizon:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    environment:
      <<: *laravel-env
    volumes:
      - ./apps/api:/var/www
      - api-vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Horizon exposes its own status via artisan; this catches a worker
      # that's alive but has stopped actually processing (paused/deadlocked).
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [maua-net]

  # Laravel's own cron replacement for local dev: `schedule:work` sleeps
  # and fires due tasks every minute in the foreground, so you get
  # scheduled jobs (cart-abandonment sweeps, stock reconciliation,
  # order-expiry cleanup) running locally without installing real cron
  # or a host-level cron entry.
  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: [ "php", "artisan", "schedule:work" ]
    environment:
      <<: *laravel-env
    volumes:
      - ./apps/api:/var/www
      - api-vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(file_exists('/proc/1/cmdline') ? 0 : 1);"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - maua-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev

    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-maua-ke}

    ports:
      - "3002:3000"

    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks: [ maua-net ]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "81:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [maua-net]

  # -------------------------------------------------------------------------
  # Local developer tooling — Mailpit (email capture) and Redis Commander
  # (browse cache/session/queue keys). Always-on: these are cheap and you
  # will reach for them constantly while building checkout/notifications.
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI — view every email the app has "sent"
      - "1025:1025" # SMTP port the api/horizon containers talk to
    networks: [maua-net]

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks: [maua-net]

  # -------------------------------------------------------------------------
  # S3-compatible object storage for local dev. Product images, invoices
  # and receipts get uploaded here exactly the way they'd upload to real
  # AWS S3 in production — no code branching between "local disk" and "s3".
  # -------------------------------------------------------------------------
  minio:
    image: docker.io/pgsty/silo:latest
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maua-ke}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maua-ke-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ maua-net ]

  # One-shot helper: creates the bucket the app expects on first boot.
  minio-init:
    image: docker.io/pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-maua-ke} ${MINIO_ROOT_PASSWORD:-maua-ke-secret};
      mc mb --ignore-existing local/${MINIO_BUCKET:-maua-ke-media};
      mc anonymous set download local/${MINIO_BUCKET:-maua-ke-media};
      "
    networks: [ maua-net ]

  # -------------------------------------------------------------------------
  # Mini observability stack — off by default (see "monitoring" profile).
  # Run with: docker compose --profile monitoring up -d
  # -------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-maua-ke}:${POSTGRES_PASSWORD:-maua-ke}@db:5432/${POSTGRES_DB:-maua-ke}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["monitoring"]
    networks: [maua-net]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["monitoring"]
    networks: [maua-net]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d" # short retention: this is a dev box, not a metrics warehouse
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter
      - redis-exporter
    profiles: ["monitoring"]
    networks: [maua-net]

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true" # frictionless local dashboards; never do this in prod
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 is already taken by the web app
    depends_on:
      - prometheus
    profiles: ["monitoring"]
    networks: [maua-net]

networks:
  maua-net:
    driver: bridge

volumes:
  web-node-modules:
  db-data:
  redis-data:
  api-vendor:
  prometheus-data:
  grafana-data:
  minio-data: