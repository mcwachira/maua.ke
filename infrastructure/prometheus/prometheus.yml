global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Uncomment once apps/api exposes a /metrics endpoint (e.g. via
  # spatie/laravel-horizon + promphp/prometheus_client_php, or a simple
  # route that dumps Horizon/queue gauges in Prometheus text format).
  # - job_name: "laravel-api"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["api:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]